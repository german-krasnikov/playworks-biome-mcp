name: Tests

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "js/**"
      - "tests/js/**"
      - ".github/workflows/test.yml"
  pull_request:
    branches: [main]
    paths:
      - "server/**"
      - "js/**"
      - "tests/js/**"
      - ".github/workflows/test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "server/uv.lock"

      - name: Ruff check
        working-directory: server
        run: uvx ruff check src/ tests/

  test:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "server/uv.lock"

      - name: Install dependencies
        working-directory: server
        run: uv sync --python ${{ matrix.python-version }} --extra dev

      - name: Run tests
        if: matrix.python-version != '3.12'
        working-directory: server
        run: uv run pytest tests/ -m "not live" -q --tb=short

      - name: Run tests with coverage
        if: matrix.python-version == '3.12'
        working-directory: server
        run: uv run pytest tests/ -m "not live" -q --tb=short --cov --cov-report=xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          files: server/coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  js-test:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "tests/js/package-lock.json"

      - name: Install dependencies
        working-directory: tests/js
        run: npm ci

      - name: Install Playwright browsers
        working-directory: tests/js
        run: npx playwright install chromium --with-deps

      - name: Run Playwright tests
        working-directory: tests/js
        run: npx playwright test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: tests/js/test-results/
          retention-days: 7
