coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: auto
        threshold: 1%

comment:
  layout: "header, diff, flags, components"
  behavior: default
  require_changes: true

ignore:
  - "server/tests/**"
  - "server/src/luna_mcp/cli/**"
  - "**/*.js"
  - "AI/**"
  - "Plans/**"
