[project]
name = "playworks-biome-mcp"
version = "0.2.2"
description = "MCP server for debugging Luna builds in Chrome via CDP"
license = "MIT"
authors = [{name = "German Krasnikov", email = "german.krasnikov@gmail.com"}]
requires-python = ">=3.10"
keywords = ["playworks", "mcp", "cdp", "chrome", "devtools", "debugging", "playable", "luna"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "mcp>=1.1.0",
    "websockets>=12.0",
    "aiohttp>=3.9",
    "Pillow>=9.0",
]

[project.urls]
Homepage = "https://github.com/german-krasnikov/playworks-biome-mcp"
Repository = "https://github.com/german-krasnikov/playworks-biome-mcp"
Issues = "https://github.com/german-krasnikov/playworks-biome-mcp/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=6.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.8.0",
]

[project.scripts]
playworks-biome-mcp = "luna_mcp.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
python_files = "test_*.py"
addopts = ["--strict-markers", "--timeout=30"]
filterwarnings = [
    "error::EncodingWarning",
    "error::ResourceWarning",
    "ignore:coroutine.*was never awaited:RuntimeWarning",
]
markers = [
    "live: requires running Chrome with Luna build",
    "timeout: per-test timeout override (pytest-timeout)",
    "slow: tests that take >5s",
    "asyncio: mark test as asyncio (auto-registered by pytest-asyncio; explicit here for --strict-markers)",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "C4"]
ignore = ["E501", "E402", "E701", "E741", "E721", "E702", "E731"]
# TODO: incrementally enable after fixing violations (~245 total):
#   UP (130), B (26), SIM (21), RET (13), TCH (27), PERF (28)

[tool.ruff.lint.isort]
known-first-party = ["luna_mcp"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F841", "E702"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/luna_mcp"]

[tool.coverage.run]
source = ["luna_mcp"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/cli/ci.py",
    "*/cli/replay.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ ==",
    "@overload",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
